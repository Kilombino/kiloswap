# lnd's gRPC for the backend, through a proxy that reads the requests: a
# request body over 256 KiB never reaches lnd (which accepts 200 MB) nor the
# guard (which lnd hands every caveat request to). The backend's requests
# are small; answers (lnd -> backend) are not limited here.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    upstream lnd { server LND_HOST:10009; }
    server {
        listen 10009 ssl;
        http2 on;
        ssl_certificate     /certs/proxy.crt;
        ssl_certificate_key /certs/proxy.key;
        client_max_body_size 256k;
        client_body_buffer_size 256k;
        # payments and invoice subscriptions are long streams
        client_body_timeout 1d;
        grpc_read_timeout 1d;
        grpc_send_timeout 1d;
        keepalive_timeout 1d;
        location / {
            grpc_pass grpcs://lnd;
            grpc_ssl_trusted_certificate /lnd/tls.cert;
            grpc_ssl_verify on;
            grpc_ssl_name LND_HOST;
            grpc_ssl_server_name on;
        }
    }
}
