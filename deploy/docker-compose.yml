# Kiloswap on the operator's host, next to the node and lnd it uses:
#   - the BLAKE2b node (Knots) runs on the host; the backend reaches its
#     RPC and ZMQ through the host's address with a whitelisted RPC user;
#   - lnd is the operator's own (container "lnd-blake2b" on the external
#     network lnd-net); the backend talks to it only with a macaroon that
#     carries the "kiloswap" caveat, so lnd hands every call to the guard
#     and refuses them all while the guard is down;
#   - the swaps' server key lives only in the guard (secrets/swap_seed): the
#     backend gets the extended public key and asks the guard for claims and
#     refunds; its own seed.dat is a fresh, unrelated one;
#   - the backend sits on an internal network: postgres, the shim (node RPC
#     and ZMQ, limited to the backend's methods), the guard's API and lnd's
#     gRPC port through lnd-proxy (nginx's gRPC proxy, with its own
#     certificate the backend trusts; requests over 256 KiB stop there).
#     The internal network is isolated: no route to lnd-net (tor-lnd), the
#     host's services, the LAN or the internet;
#   - nothing is published but the web front on 127.0.0.1 (a tunnel and an
#     onion service in front of it).
#
# Paths and secrets come from .env (see .env.example and setup.sh). Data
# lives under KILOSWAP_ROOT.
name: kiloswap

x-logging: &logging
  driver: json-file
  options: {max-size: 20m, max-file: "5"}

networks:
  default:
    ipam:
      config: [{subnet: "${KILOSWAP_SUBNET:-172.30.91.0/24}"}]
  internal:
    internal: true
    # no route to the host either: services on the host's addresses
    # (Thunderhub, LNDg, lnd's REST, ...) are unreachable from this network
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{subnet: "${KILOSWAP_INTERNAL_SUBNET:-172.30.92.0/24}"}]
  lnd:
    name: ${LND_NETWORK:-lnd-net}
    external: true
  explorer:
    name: ${EXPLORER_NETWORK:-mempool-deploy_default}
    external: true

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      # the superuser is for maintenance only; the backend's role "boltz" is
      # an ordinary owner of its database (postgres-init/10-boltz-role.sh)
      POSTGRES_DB: postgres
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    networks: [internal]
    volumes:
      - ${KILOSWAP_ROOT:?}/postgres:/var/lib/postgresql
      - ${KILOSWAP_ROOT:?}/secrets/postgres_password:/run/secrets/postgres_password:ro
      - ${KILOSWAP_ROOT:?}/secrets/postgres_admin_password:/run/secrets/postgres_admin_password:ro
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    logging: *logging
    mem_limit: 256m

  # Paul's txindex shim between the backend and the node: the node keeps a
  # txindex, the shim also forwards ZMQ, as the backend expects it
  shim:
    image: kiloswap/txindex-shim:${SHIM_TAG:-dev}
    # Paul's txindex shim with Kiloswap's limits (../shim): the backend's
    # methods only with their parameters checked (batches judged per
    # element, at most 100 and at most 10 raw items, 4 of them blocks),
    # the empty wallet only, 8 calls at once, answers up to 32 MB (256 MB
    # of memory leaves room for one held twice), ZMQ relayed to at most
    # 16 subscribers, a stalled one dropped after 10 s
    build: ../shim
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      SHIM_UPSTREAM: http://${NODE_HOST:?}:${NODE_RPC_PORT:-8332}/
      SHIM_RPCUSER: kiloswap
      SHIM_RPCPASSWORD: ${NODE_RPC_PASSWORD:?run setup.sh}
      SHIM_DB: /data/txindex.db
      SHIM_WINDOW: "8640"
      SHIM_FORWARD: 28332=${NODE_HOST}:28332,28333=${NODE_HOST}:28333
      SHIM_WALLET: kiloswap-empty
    networks: [default, internal]
    volumes:
      - ${KILOSWAP_ROOT:?}/shim:/data
    logging: *logging
    mem_limit: 256m

  guard:
    image: kiloswap/guard:${GUARD_TAG:-dev}
    build: ../guard
    security_opt: [no-new-privileges:true]
    read_only: true
    restart: unless-stopped
    depends_on: [postgres]
    # internal: postgres and the backend's calls to its API; lnd: register
    # as middleware; default: the node's RPC on the host (its own user)
    networks:
      internal:
        ipv4_address: ${KILOSWAP_GUARD_IP:-172.30.92.10}
      lnd: {}
      default: {}
    environment:
      LND_GRPC: ${LND_HOST:-lnd-blake2b}:10009
      GOMEMLIMIT: 100MiB
      LND_TLSCERT: /lnd/tls.cert
      LND_MACAROON: /lnd/kiloswap-guard.macaroon
      DATABASE_URL_FILE: /run/secrets/guard_db_url
      CHAIN_RPC_URL: http://${NODE_HOST}:${NODE_RPC_PORT:-8332}/
      CHAIN_RPC_USER: kiloswap-guard
      CHAIN_RPC_PASSWORD_FILE: /run/secrets/guard_rpc_password
      NETWORK: mainnet
      SWAP_MNEMONIC_FILE: /run/secrets/swap_seed
      SWAP_KEY_PATH: m/0/0
      # the claims-and-refunds API on the internal network only
      API_ADDR: "${KILOSWAP_GUARD_IP:-172.30.92.10}:8091"
      API_TOKEN_FILE: /run/secrets/guard_api_token
      LSP_STATE: /lsp/state.json
      LEDGER: /state/ledger.json
      ALERT_URL: ${ALERT_URL:-}
      # launch limits by default (0.1 BTC per operation, 0.25 BTC a day);
      # the later 1 / 2 BTC only by setting both explicitly in .env
      MAX_PER_OP_SAT: ${MAX_PER_OP_SAT:-10000000}
      DAILY_SAT: ${DAILY_SAT:-25000000}
      RESERVE_SAT: ${RESERVE_SAT:-50000000}
      MAX_PENDING_REVERSE: ${MAX_PENDING_REVERSE:-5}
      MAX_UNRESOLVED: ${MAX_UNRESOLVED:-2}
      MIN_REVERSE_SAT: ${MIN_REVERSE_SAT:-10000}
      MAX_LOCKUPS_PER_BLOCK: ${MAX_LOCKUPS_PER_BLOCK:-2}
      # routing paid from the lockup's surplus, 10 sat floor (option A)
      ROUTING_CAP: ${ROUTING_CAP:-1}
      ROUTING_FLOOR_SAT: ${ROUTING_FLOOR_SAT:-10}
      MIN_FEE_SAT: ${MIN_FEE_SAT:-10}
      FEE_RATIO: ${FEE_RATIO:-0.0001}
      REQUIRED_CONFS: ${REQUIRED_CONFS:-3}
      HOLD_EXPIRY_DELTA: "18"
    volumes:
      - ${LND_DIR:?}/tls.cert:/lnd/tls.cert:ro
      - ${KILOSWAP_ROOT:?}/macaroons/kiloswap-guard.macaroon:/lnd/kiloswap-guard.macaroon:ro
      - ${LSP_STATE:?}:/lsp/state.json:ro
      - ${KILOSWAP_ROOT:?}/guard:/state
      - ${KILOSWAP_ROOT:?}/secrets/guard_db_url:/run/secrets/guard_db_url:ro
      - ${KILOSWAP_ROOT:?}/secrets/guard_rpc_password:/run/secrets/guard_rpc_password:ro
      - ${KILOSWAP_ROOT:?}/secrets/swap_seed:/run/secrets/swap_seed:ro
      - ${KILOSWAP_ROOT:?}/secrets/guard_api_token:/run/secrets/guard_api_token:ro
    logging: *logging
    # lnd's messages to it are at most 8 MiB (MaxMessageBytes); requests
    # over 256 KiB never get through lnd-proxy
    mem_limit: 160m

  # lnd's gRPC port, and nothing else of lnd-net, for the backend, through
  # nginx's gRPC proxy: requests over 256 KiB stop here (lnd would take 200
  # MB and hand each to the guard). The backend trusts the proxy's own
  # certificate (setup.sh), the proxy checks lnd's.
  lnd-proxy:
    image: nginx:1.27-alpine
    security_opt: [no-new-privileges:true]
    read_only: true
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "sed \"s/LND_HOST/$$LND_HOST/g\" /etc/lnd-proxy/nginx.conf > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'"]
    environment:
      LND_HOST: ${LND_HOST:-lnd-blake2b}
    tmpfs: [/tmp]
    networks: [lnd, internal]
    volumes:
      - ./lnd-proxy/nginx.conf:/etc/lnd-proxy/nginx.conf:ro
      - ${KILOSWAP_ROOT:?}/secrets/lnd-proxy:/certs:ro
      - ${LND_DIR:?}/tls.cert:/lnd/tls.cert:ro
    logging: *logging
    mem_limit: 64m

  boltz:
    image: kiloswap/backend:${BACKEND_TAG:-dev}
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 1m
    depends_on: [postgres, shim, guard, lnd-proxy]
    networks: [internal]
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      KILOSWAP_SWAP_XPUB_FILE: /run/secrets/swap_xpub
      KILOSWAP_GUARD_URL: http://guard:8091
      KILOSWAP_GUARD_TOKEN_FILE: /run/secrets/guard_api_token
    command: ["--configpath", "/boltz/boltz.conf", "--datadir", "/boltz"]
    volumes:
      - ${KILOSWAP_ROOT:?}/boltz:/boltz
      - ${KILOSWAP_ROOT:?}/secrets/lnd-proxy/proxy.crt:/lnd/tls.cert:ro
      - ${KILOSWAP_ROOT:?}/macaroons/kiloswap.macaroon:/lnd/kiloswap.macaroon:ro
      - ${KILOSWAP_ROOT:?}/secrets/swap_xpub:/run/secrets/swap_xpub:ro
      - ${KILOSWAP_ROOT:?}/secrets/guard_api_token_backend:/run/secrets/guard_api_token:ro
    logging: *logging
    mem_limit: 1024m

  web:
    image: nginx:1.31.9-alpine
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on: [boltz]
    networks: [default, internal, explorer]
    ports:
      - "127.0.0.1:${WEB_PORT:-3260}:8080"   # Cloudflare tunnel
      - "127.0.0.1:${ONION_PORT:-3261}:8081" # onion service
    volumes:
      - ./nginx/kiloswap.conf:/etc/nginx/conf.d/default.conf:ro
      - ${KILOSWAP_ROOT:?}/webapp:/srv/webapp:ro
    logging: *logging
    mem_limit: 64m
