# Kiloswap's front: the web app, the backend's public API (an allowlist of
# routes, as in paulscode/lightning-fork-swap's deploy/nginx) and the
# explorer API of our own mempool. Plain HTTP on two ports, each reached
# only from 127.0.0.1: 8080 behind the Cloudflare tunnel (TLS there), 8081
# behind the onion service. No IP address is logged.

map "$request_method:$uri" $kiloswap_api_ok {
    default 0;
    "~^GET:/v2/swap/(submarine|reverse)$"                                      1;
    "~^POST:/v2/swap/(submarine|reverse)$"                                     1;
    "~^GET:/v2/swap/status$"                                                   1;
    "~^GET:/v2/swap/[A-Za-z0-9]{6,32}$"                                        1;
    "~^GET:/v2/swap/submarine/[A-Za-z0-9]{6,32}/(transaction|preimage|claim)$" 1;
    "~^POST:/v2/swap/submarine/[A-Za-z0-9]{6,32}/(refund|claim)$"              1;
    "~^GET:/v2/swap/reverse/[A-Za-z0-9]{6,32}/transaction$"                    1;
    "~^POST:/v2/swap/reverse/[A-Za-z0-9]{6,32}/claim$"                         1;
    "~^GET:/v2/swap/reverse/[A-Za-z0-9]{20,2048}/bip21$"                       1;
    "~^GET:/v2/chain/fees$"                                                    1;
    "~^POST:/v2/chain/BTC/transaction$"                                        1;
}

map "$request_method:$uri" $kiloswap_explorer_ok {
    default 0;
    "~^GET:/explorer/api/address/[A-Za-z0-9]{14,100}/utxo$"         1;
    "~^GET:/explorer/api/address/[A-Za-z0-9]{14,100}$"              1;
    "~^GET:/explorer/api/address/[A-Za-z0-9]{14,100}/txs/mempool$"  1;
    "~^GET:/explorer/api/tx/[0-9a-f]{64}/(hex|status)$"             1;
    "~^GET:/explorer/api/tx/[0-9a-f]{64}/outspend/[0-9]{1,5}$"      1;
    "~^GET:/explorer/api/blocks/tip/height$"                        1;
    "~^GET:/explorer/api/(fee-estimates|v1/fees/recommended)$"      1;
    "~^POST:/explorer/api/tx$"                                      1;
}

# Requests come from the tunnel or Tor: everyone shares an address, so the
# limits are per connection source as nginx sees it, kept generous
limit_req_zone $binary_remote_addr zone=ks_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ks_create:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ks_restore:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ks_explorer:10m rate=10r/s;

log_format kiloswap '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ks_boltzd  { server boltz:9001; keepalive 8; }
upstream ks_sidecar { server boltz:9005; keepalive 8; }
upstream ks_ws      { server boltz:9004; }
# our mempool's web container serves its API at /api
upstream ks_explorer { server mempool-web:8080; keepalive 4; }

map $uri $ks_cache_control {
    /index.html        "no-cache";
    /service-worker.js "no-cache";
    default            "";
}

map $server_port $ks_ws_origin {
    8080 "wss://swap.kilombino.com";
    default "";
}

server {
    listen 8080 default_server;
    listen 8081;
    server_name _;
    access_log /var/log/nginx/access.log kiloswap;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' $ks_ws_origin; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Cache-Control $ks_cache_control;

    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 20s;

    root /srv/webapp;
    index index.html;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";

    if ($request_uri ~ "^[^?]*(%|//|/\.)") {
        return 400;
    }

    location = /v2/ws {
        proxy_pass http://ks_ws/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
    location = /v2/swap/restore {
        limit_except POST { deny all; }
        limit_req zone=ks_restore burst=5 nodelay;
        proxy_pass http://ks_sidecar$uri;
    }
    location ~ ^/v2/swap/(submarine|reverse)$ {
        if ($kiloswap_api_ok = 0) { return 404; }
        # Swaps paused (maintenance): touch the file to refuse new swaps;
        # refunds, rescues and pending swaps keep working
        if (-f /srv/webapp/PAUSED) { return 503; }
        limit_req zone=ks_create burst=10 nodelay;
        limit_req zone=ks_api burst=40 nodelay;
        proxy_pass http://ks_boltzd$uri$is_args$args;
    }
    location /v2/ {
        if ($kiloswap_api_ok = 0) { return 404; }
        limit_req zone=ks_api burst=40 nodelay;
        proxy_pass http://ks_boltzd$uri$is_args$args;
    }
    location /explorer/api/ {
        if ($kiloswap_explorer_ok = 0) { return 404; }
        limit_req zone=ks_explorer burst=20 nodelay;
        rewrite ^/explorer/api/(.*)$ /api/$1 break;
        proxy_set_header Host mempool.kilombino.com;
        proxy_pass http://ks_explorer;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
